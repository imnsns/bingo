<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>賓果 BINGO</title>
<meta name="description" content="手機連線賓果：主持人抽題，大家手機即時同步">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one phone column — live call strip, 5×5 card, leaderboard; #screen = projector board */
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --ink:#26282A; --muted:#6B7075; --line:#D6D8D9;
  --orange:#FF801E; --orange-ink:#B85000; --on-orange:#2A1300;
  --blue:#00A3E0; --blue-ink:#0073A8; --on-blue:#00202D; --blue-soft:#DDF3FB;
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181A; --surface:#212427; --ink:#ECEDEE; --muted:#9AA0A6; --line:#3A3E42;
  --orange-ink:#FF9C50; --blue-ink:#4CC6F0; --blue-soft:#0D3343; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181A; --surface:#212427; --ink:#ECEDEE; --muted:#9AA0A6; --line:#3A3E42;
  --orange-ink:#FF9C50; --blue-ink:#4CC6F0; --blue-soft:#0D3343; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
body.screen .wrap{max-width:1280px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;line-height:1}
.brand b{color:var(--orange-ink);font-weight:400}.brand i{color:var(--blue-ink);font-style:normal}
.sub{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.note.warn{border-color:var(--orange);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.btn-main{background:var(--orange);color:var(--on-orange)}
.btn-blue{background:var(--blue);color:var(--on-blue)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
/* host bar */
.host{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px dashed var(--orange);border-radius:12px;padding:10px 12px}
.host .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--orange-ink);margin-right:auto}
.host a{color:var(--blue-ink);font-size:13px;font-weight:700}
/* call strip */
.call{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;background:var(--surface);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.call .k{font-size:12px;color:var(--muted);letter-spacing:.08em}
.call .word{font-size:32px;font-weight:900;line-height:1.15;grid-column:1;word-break:break-all}
.call .cnt{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--display);font-size:28px;line-height:1;color:var(--blue-ink);font-variant-numeric:tabular-nums}
.call .cnt small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);margin-top:4px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.recent{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/3}
.recent span{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}
/* card */
.card{background:var(--surface);border-radius:16px;padding:10px;border:1px solid var(--line)}
.letters,.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.letters span{font-family:var(--display);text-align:center;font-size:22px;line-height:1.3}
.letters span:nth-child(odd){color:var(--orange-ink)}.letters span:nth-child(even){color:var(--blue-ink)}
.cell{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;
  border-radius:10px;background:var(--bg);font-size:clamp(11px,3.4vw,16px);font-weight:700;line-height:1.15;overflow-wrap:anywhere;transition:background .25s,color .25s}
.cell{flex-direction:column;gap:1px}.cell small{display:block;font-size:.68em;font-weight:400;line-height:1.1}
.call .word small{display:block;font-size:.45em;font-weight:700;color:var(--muted)}
.words span small,.recent span small{margin-left:4px;font-size:.85em}
.cell.hit{background:var(--orange);color:var(--on-orange)}
.cell.win{background:var(--blue);color:var(--on-blue)}
.cell.free{background:var(--blue-soft);color:var(--blue-ink);font-family:var(--display);font-weight:400}
.cell.free.win{background:var(--blue);color:var(--on-blue)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px 2px;font-size:14px}
.status b{font-variant-numeric:tabular-nums}
.bingo{font-family:var(--display);font-size:34px;text-align:center;color:var(--orange-ink);line-height:1.1}
.bingo small{display:block;font-family:var(--body);font-size:14px;color:var(--ink);font-weight:700}
/* join */
.join{background:var(--surface);border-radius:16px;padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.join h2{margin:0;font-size:20px;text-wrap:balance}
.join input{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
/* leaderboard */
.board h3,.allwords h3{margin:0 0 8px;font-size:14px;letter-spacing:.06em;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rank li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.rank li.me{outline:2px solid var(--blue)}
.rank .n{font-family:var(--display);color:var(--muted)}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.b{background:var(--orange);color:var(--on-orange)}
.tag.r{background:var(--blue-soft);color:var(--blue-ink)}
.tag.z{color:var(--muted)}
/* all words */
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.words span.on{background:var(--orange);color:var(--on-orange);border-color:var(--orange);font-weight:700}
/* projector */
body.screen .call .word{font-size:clamp(40px,8vw,96px)}
body.screen .call .cnt{font-size:clamp(32px,5vw,64px)}
body.screen .scr{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}
body.screen .words span{font-size:clamp(14px,1.4vw,20px)}
@media (max-width:760px){body.screen .scr{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.cell{transition:none}}
.cfg{display:flex;flex-direction:column;gap:10px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.cfg input,.cfg textarea,.cfg select{font:inherit;font-size:16px;font-weight:400;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cfg textarea{resize:vertical;min-height:220px;line-height:1.5}
.cfg .err{color:var(--orange-ink);font-size:13px;font-weight:700}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand" style="color:var(--orange-ink)">賓果 BINGO</div>
    <div class="sub" id="subt"></div>
  </header>
  <div id="msg" class="note">連線中…</div>
  <div id="host" class="host" hidden></div>
  <div id="settings"></div>
  <div id="app"></div>
</div>

<script>
const TOPIC="partygame-bingo-q8k3v7m2";
/* ---------- ntfy 即時連線（免登入） ---------- */
const NTFY="https://ntfy.sh";
const TP=TOPIC+"-p";
let isHost=location.hash==="#host",demo=false,es=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const uid=(()=>{let id=store.get("party:id");if(!id){id="p"+Math.random().toString(36).slice(2,12);store.set("party:id",id)}return id})();
async function pub(topic,obj){
  if(demo)return true;
  for(let i=0;i<4;i++){
    try{const r=await fetch(NTFY+"/"+topic,{method:"POST",body:JSON.stringify(obj)});if(r.ok)return true;if(r.status!==429)return false}catch(e){}
    await new Promise(r=>setTimeout(r,3000*(i+1)));
  }
  return false;
}
function connect(onGame,onPlayer){
  let opened=false;
  const t=setTimeout(()=>{if(!opened)offerDemo()},5000);
  es=new EventSource(`${NTFY}/${TOPIC},${TP}/sse?since=12h`);
  es.onopen=()=>{opened=true;clearTimeout(t);if(!demo)showMsg("")};
  es.onerror=()=>{if(opened&&!demo)showMsg("連線中斷，正在自動重新連線…",true)};
  es.onmessage=e=>{
    let m,d;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.event==="open"){opened=true;clearTimeout(t);if(!demo)showMsg("");return}
    if(m.event!=="message"||!m.message)return;
    try{d=JSON.parse(m.message)}catch(x){return}
    if(!d||typeof d!=="object"||typeof d.round!=="string"||typeof d.t!=="number")return;
    if(m.topic===TOPIC)onGame(d);else if(m.topic===TP&&typeof d.id==="string")onPlayer(d);
  };
}
/* 預覽視窗等沙盒環境會擋表單送出：改由程式觸發，所有環境都能用 */
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest('button[type="submit"]');
  if(b&&b.form){e.preventDefault();b.form.dispatchEvent(new Event("submit",{cancelable:true}))}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.isComposing)return;const t=e.target;
  if(t&&t.tagName==="INPUT"&&t.form){e.preventDefault();t.form.dispatchEvent(new Event("submit",{cancelable:true}))}});
function offerDemo(){
  const m=document.querySelector("#msg");m.hidden=false;m.classList.add("warn");
  m.innerHTML=`連不上遊戲伺服器（網路被擋或沒有網路），畫面會自動重試。<br><button class="btn-main" id="demoBtn" style="margin-top:8px">單機試玩（只在這台裝置，不同步）</button>`;
  m.querySelector("#demoBtn").addEventListener("click",()=>{demo=true;isHost=true;try{es&&es.close()}catch(e){}
    showMsg("單機試玩中：主持人按鈕和你的卡在同一個畫面，不會同步到其他手機。");render();});
}
function showMsg(t,warn){const m=document.querySelector("#msg");m.hidden=!t;m.textContent=t||"";m.classList.toggle("warn",!!warn)}
const DEFAULT_POOL=["USLAX 洛杉磯", "USORD 芝加哥", "CNNBO 寧波", "CNYTN 鹽田", "THBKK 曼谷", "DEHAM 漢堡", "CNSHA 上海", "USNYC 紐約", "USLGB 長灘", "USCMH 哥倫布", "CNPVG 上海浦東", "CNNGB 寧波機場", "VNSGN 胡志明市", "HKHKG 香港", "BDDAC 達卡", "SGSIN 新加坡", "DESTR 斯圖加特", "CNSHK 蛇口", "CNCAN 廣州", "USCHS 查爾斯頓", "MKSKP 史高比耶", "VNHPH 海防", "USMIA 邁阿密", "CNCTU 成都", "TTPOS 西班牙港", "USDAL 達拉斯", "CNTAO 青島", "ESVLC 瓦倫西亞", "KZALA 阿拉木圖", "IDCGK 雅加達", "USSEA 西雅圖", "RUSVO 莫斯科", "DEFRA 法蘭克福", "ITMXP 米蘭", "AUSYD 雪梨", "KHKTI 金邊", "PTLIS 里斯本", "CNNKG 南京", "CNSZX 深圳", "KRICN 仁川", "KRPUS 釜山", "JPNRT 東京成田", "INBOM 孟買", "CATOR 多倫多", "AEDXB 杜拜"];
let POOL=DEFAULT_POOL;
const CFG_KEY="partybingo:cfg";
let cfg=null;
function loadCfg(key,def){try{const c=JSON.parse(store.get(key)||"null");return c&&typeof c==="object"?{...def,...c}:{...def}}catch(e){return {...def}}}
function applyHeader(title,sub){$("#brand").textContent=title;$("#subt").textContent=sub;$("#subt").hidden=!sub;document.title=title}
function closeCfg(){$("#settings").innerHTML=""}
cfg=loadCfg(CFG_KEY,{title:"賓果 BINGO",sub:"",pool:DEFAULT_POOL});
function openCfg(){
  $("#settings").innerHTML=`<form class="join cfg" id="cfgf"><h2>遊戲設定</h2>
    <label>標題<input id="cTitle" maxlength="20" value="${esc(cfg.title)}"></label>
    <label>副標（可留空）<input id="cSub" maxlength="40" value="${esc(cfg.sub)}"></label>
    <label>賓果題目（一行一個，24–80 個，每個最多 12 字；「代碼 名稱」中間空一格，名稱會以小字顯示）<textarea id="cPool">${esc(cfg.pool.join("\n"))}</textarea></label>
    <div class="sub" id="cInfo"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-main" type="submit">儲存設定</button><button type="button" class="btn-ghost" id="cClose">關閉</button></div>
    <p class="sub" style="margin:0">設定存在這台裝置，按下一次「新的一局」時套用到大家的畫面。</p></form>`;
  const info=()=>{$("#cInfo").textContent=`目前 ${parsePool().length} 個題目`};
  $("#cPool").addEventListener("input",info);info();
  $("#cClose").addEventListener("click",closeCfg);
  $("#cfgf").addEventListener("submit",e=>{e.preventDefault();
    const pool=parsePool(),title=$("#cTitle").value.trim()||"賓果 BINGO",sub=$("#cSub").value.trim();
    const bad=pool.find(w=>w.length>12);
    if(pool.length<24||pool.length>80||bad){$("#cInfo").innerHTML=`<span class="err">${bad?`「${esc(bad)}」超過 12 個字`:`題目要 24–80 個，目前 ${pool.length} 個`}</span>`;return}
    cfg={title,sub,pool};store.set(CFG_KEY,JSON.stringify(cfg));
    $("#cInfo").innerHTML=`<b>已儲存</b>，按「${game?"新的一局":"開始第一局"}」後套用。`;
    if(!game)applyHeader(cfg.title,cfg.sub);
  });
}
function parsePool(){return [...new Set(($("#cPool")?.value||"").split(/\n/).map(x=>x.trim()).filter(Boolean))]}
function fmt(w){w=String(w);const k=w.indexOf(" ");return k<0?esc(w):`${esc(w.slice(0,k))}<small>${esc(w.slice(k+1))}</small>`}
const LINES=(()=>{const L=[];for(let i=0;i<5;i++){L.push([0,1,2,3,4].map(j=>i*5+j));L.push([0,1,2,3,4].map(j=>j*5+i))}
  L.push([0,6,12,18,24]);L.push([4,8,12,16,20]);return L})();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let game=null,pmap={},me=null,busy=false,localOnly=false,confirmReset=false,lastShown="";
const isScreen=()=>location.hash==="#screen"||location.hash==="#host";
const playerList=()=>Object.values(pmap);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cellsOf(card){const c=card.slice(0,24);c.splice(12,0,"FREE");return c}
function evalCard(card,drawn){
  const set=new Set(drawn),c=cellsOf(card),hit=c.map(x=>x==="FREE"||set.has(x));
  const done=LINES.filter(l=>l.every(i=>hit[i]));
  const ready=LINES.some(l=>l.filter(i=>!hit[i]).length===1);
  let first=null;
  if(done.length){for(let k=1;k<=drawn.length;k++){const s=new Set(drawn.slice(0,k));
    if(LINES.some(l=>l.every(i=>c[i]==="FREE"||s.has(c[i])))){first=k;break}}}
  return {c,hit,win:new Set(done.flat()),lines:done.length,ready,first};
}

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle("screen",isScreen());
  applyHeader(game?.title||(isHost?cfg.title:"賓果 BINGO"),game?(game.sub||""):(isHost?cfg.sub:""));
  renderHost();
  const app=$("#app");
  if(!game){app.innerHTML=isHost?`<div class="join"><h2>還沒開局</h2><p class="sub">按上方「開始第一局」，大家就能拿到賓果卡。</p></div>`
    :`<div class="join"><h2>等主持人開局</h2><p class="sub">開局後這頁會自動出現你的賓果卡，不用重新整理。</p></div>`;return}
  const drawn=game.drawn||[],latest=drawn[drawn.length-1];
  const callHtml=`<section class="call" aria-live="polite">
    <div class="k">${drawn.length?"最新抽出":"等待第一個題目"}</div>
    <div class="cnt">${drawn.length}<small>/ ${POOL.length}</small></div>
    <div class="word ${latest&&latest!==lastShown?"pop":""}">${latest?fmt(latest):"—"}</div>
    ${!isScreen()&&me&&latest?`<div style="grid-column:1/3">${me.card.includes(latest)?`<span class="tag b">在你的卡上，已自動圈起</span>`:`<span class="tag z">這個詞不在你的卡上，等下一個</span>`}</div>`:""}
    ${!isScreen()&&drawn.length>1?`<div class="recent">${drawn.slice(-6,-1).reverse().map(w=>`<span>${fmt(w)}</span>`).join("")}</div>`:""}
  </section>`;
  lastShown=latest||"";
  const boardHtml=renderBoard(drawn);
  if(isScreen()){
    app.innerHTML=`${callHtml}<div class="scr"><section class="allwords"><h3>題庫（橘色 = 已抽出）</h3><div class="words">${
      POOL.map(w=>`<span class="${drawn.includes(w)?"on":""}">${fmt(w)}</span>`).join("")}</div></section>${boardHtml}</div>
      ${isHost?"":`<a href="#" class="sub">← 回到我的賓果卡</a>`}`;
    return;
  }
  if(!me){
    const typing=$("#nm"),hadFocus=typing&&document.activeElement===typing;
    const saved=typing?typing.value:(store.get("partybingo:name")||"");
    app.innerHTML=`${callHtml}<form class="join" id="joinf"><h2>輸入名字，拿你的賓果卡</h2>
      <input id="nm" maxlength="12" placeholder="例如 Nerissa" value="${esc(saved)}" autocomplete="nickname" required>
      <button class="btn-main" type="submit">拿賓果卡</button>
      <p class="sub" style="margin:0">每人一張隨機卡。主持人抽到的詞會自動幫你圈起來，連成一條線就是賓果。</p></form>${boardHtml}`;
    $("#joinf").addEventListener("submit",e=>{e.preventDefault();join($("#nm").value.trim())});
    if(hadFocus){const n=$("#nm");n.focus();n.setSelectionRange(n.value.length,n.value.length)}
    return;
  }
  const r=evalCard(me.card,drawn);
  const cellHtml=r.c.map((w,i)=>`<div class="cell ${w==="FREE"?"free":""} ${r.hit[i]&&w!=="FREE"?"hit":""} ${r.win.has(i)?"win":""}">${w==="FREE"?"FREE":fmt(w)}</div>`).join("");
  app.innerHTML=`${callHtml}
    ${r.lines?`<div class="bingo">BINGO!<small>${r.lines} 條線・第 ${r.first} 抽達成，快舉手喊賓果！</small></div>`:""}
    <section class="card" aria-label="我的賓果卡">
      <div class="letters" aria-hidden="true"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
      <div class="grid">${cellHtml}</div>
      <div class="status"><span>${esc(me.name)} 的卡</span><span>連線 <b>${r.lines}</b> 條${!r.lines&&r.ready?"・<span class='tag r'>聽牌</span>":""}</span></div>
    </section>
    ${localOnly?`<div class="note warn">你的卡沒送上排行榜（網路不穩）。照樣可以玩，賓果時舉手喊就好。</div>`:""}
    ${boardHtml}
    <a href="#screen" class="sub">大螢幕模式（投影用）→</a>`;
}

function renderBoard(drawn){
  const rows=playerList().filter(p=>p.round===game.round&&Array.isArray(p.card)).map(p=>({...p,...evalCard(p.card,drawn)}));
  if(!rows.length)return `<section class="board"><h3>排行榜</h3><div class="note">還沒有人加入這一局。</div></section>`;
  rows.sort((a,b)=>(a.first??999)-(b.first??999)||b.lines-a.lines||(b.ready-a.ready)||(a.t||0)-(b.t||0));
  const max=isScreen()?12:8;let list=rows.slice(0,max);
  const mi=rows.findIndex(p=>p.id===uid);if(mi>=max)list=list.concat(rows[mi]);
  return `<section class="board"><h3>排行榜・${rows.length} 人在玩・${rows.filter(p=>p.lines).length} 人賓果</h3><ol class="rank">${
    list.map(p=>`<li class="${p.id===uid?"me":""}"><span class="n">${rows.indexOf(p)+1}</span><span class="nm">${esc(p.name||"玩家")}</span>${
      p.lines?`<span class="tag b">賓果 ${p.lines} 條・第${p.first}抽</span>`:p.ready?`<span class="tag r">聽牌</span>`:`<span class="tag z">—</span>`}</li>`).join("")}</ol></section>`;
}

function renderHost(){
  const h=$("#host");h.hidden=!isHost;if(!isHost)return;
  const drawn=game?.drawn||[];
  if(!game){h.innerHTML=`<span class="lbl">主持人</span><button class="btn-main" id="hStart">開始第一局</button>`;}
  else if(confirmReset){h.innerHTML=`<span class="lbl">確定重開？已抽 ${drawn.length} 個會清空，大家拿新卡</span>
    <button class="btn-main" id="hReset2">確定新的一局</button><button class="btn-ghost" id="hCancel">取消</button>`;}
  else{h.innerHTML=`<span class="lbl">主持人</span>
    <button class="btn-main" id="hDraw" ${drawn.length>=POOL.length||busy?"disabled":""}>抽下一個</button>
    <button class="btn-ghost" id="hUndo" ${!drawn.length||busy?"disabled":""}>收回上一個</button>
    <button class="btn-ghost" id="hReset" ${busy?"disabled":""}>新的一局</button>`;}
  if(!confirmReset)h.insertAdjacentHTML("beforeend",`<button class="btn-ghost" id="hCfg">設定</button>`);
  h.querySelector("#hCfg")?.addEventListener("click",()=>{$("#settings").innerHTML?closeCfg():openCfg()});
  h.querySelector("#hStart")?.addEventListener("click",()=>newRound());
  h.querySelector("#hDraw")?.addEventListener("click",draw);
  h.querySelector("#hUndo")?.addEventListener("click",undo);
  h.querySelector("#hReset")?.addEventListener("click",()=>{if(!drawn.length)newRound();else{confirmReset=true;renderHost()}});
  h.querySelector("#hReset2")?.addEventListener("click",()=>{confirmReset=false;newRound()});
  h.querySelector("#hCancel")?.addEventListener("click",()=>{confirmReset=false;renderHost()});
}

/* ---------- actions ---------- */
async function writeGame(next){
  if(busy)return;busy=true;renderHost();
  next={...next,t:Date.now()};
  const ok=await pub(TOPIC,next);
  if(ok)onGame(next);else showMsg("沒送出去，網路不穩，請再按一次。",true);
  busy=false;renderHost();
}
function newRound(){closeCfg();writeGame({round:"r"+Date.now(),drawn:[],title:cfg.title,sub:cfg.sub,pool:cfg.pool})}
function draw(){const d=game.drawn||[];const left=POOL.filter(w=>!d.includes(w));if(!left.length)return;
  writeGame({...game,drawn:d.concat(left[Math.floor(Math.random()*left.length)])})}
function undo(){const d=game.drawn||[];if(d.length)writeGame({...game,drawn:d.slice(0,-1)})}

async function join(name){
  if(!name)return;store.set("partybingo:name",name);
  const card=shuffle(POOL.slice()).slice(0,24);
  me={name,card,round:game.round};
  store.set("partybingo:card:"+game.round,JSON.stringify(me));
  render();
  const rec={id:uid,name,card,round:game.round,t:Date.now()};
  localOnly=!(await pub(TP,rec));
  if(!localOnly)onPlayer(rec);
  render();
}
function resolveMe(){
  if(!game){me=null;return}
  const mine=pmap[uid];
  if(mine&&mine.round===game.round){me={name:mine.name,card:mine.card,round:mine.round};localOnly=false;return}
  if(me&&me.round===game.round)return;
  me=null;
  try{const s=JSON.parse(store.get("partybingo:card:"+game.round)||"null");if(s&&s.round===game.round)me=s}catch(e){}
}
let rq=0;function schedule(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}
function onGame(d){if(!Array.isArray(d.drawn))return;if(game&&d.t<game.t)return;game=d;
  POOL=Array.isArray(d.pool)&&d.pool.length>=24?d.pool.map(String):DEFAULT_POOL;resolveMe();schedule()}
function onPlayer(d){if(!Array.isArray(d.card))return;const o=pmap[d.id];if(o&&o.t>d.t)return;pmap[d.id]=d;resolveMe();schedule()}

/* ---------- boot ---------- */
render();
addEventListener("hashchange",()=>location.reload());
connect(onGame,onPlayer);
</script>
